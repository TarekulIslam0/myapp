name: Build APK Direct
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install
        
      - name: Install Expo
        run: npm install -g expo
        
      - name: Export web version
        run: npx expo export --platform android
        
      - name: Create APK from web build
        run: |
          npm install -g @expo/webpack-config
          npx expo export:embed --platform android
          cd dist
          zip -r ../app.zip *
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app.zip
